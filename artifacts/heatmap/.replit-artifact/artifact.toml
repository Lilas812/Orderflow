kind = "web"
previewPath = "/"
title = "NQ Heatmap"
description = "NQ先物のヒートマップ。公開先は画面とAPIを1つの受信プロセスで配信する。"
version = "1.0.0"
id = "artifacts/heatmap"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 25028

[services.development]
run = "pnpm --filter @workspace/heatmap run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/receiver", "run", "build"]
run = ["pnpm", "--filter", "@workspace/receiver", "run", "start"]

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "25028"
BASE_PATH = "/"
